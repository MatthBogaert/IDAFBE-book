jupyter: da2026 # kernel for the DA2026 conda env; see requirements.txt for pinned versions

execute:
  freeze: auto  # re-execute a chapter's code only when that chapter's .qmd file has changed
  cache: true   # within a re-execution, skip individual code cells unchanged since the last run
                # (a pure prose/markdown edit won't invalidate any code cell at all)

project:
  type: book
  output-dir: _book
  render:
    - "*.qmd"
    - "chapters/*.qmd"
    - "!notebooks_student/"   # student notebooks are hand-maintained, never rendered by Quarto
    - "!notebooks_source/"    # original raw notebooks, also never rendered

book:
  title: "Introduction to Data Analytics for Business and Economics"
  subtitle: "Using Python for Data Preprocessing, Visualization, and Modeling"
  author: "Matthias Bogaert"
  date: "2026"   # fixed publication year, not a live render timestamp
  date-format: "YYYY"   # otherwise Quarto expands "2026" into a full date like "2026-01-01"
  cover-image: images/cover-final-spaced.jpg   # website cover; EPUB keeps images/cover.png until its own new cover is ready
  repo-url: https://github.com/MatthBogaert/IDAFBE-book
  repo-actions: [source, issue]
  chapters:
    - index.qmd
    - chapters/01-intro.qmd
    - chapters/02-python-basics.qmd
    - chapters/03-data-understanding.qmd
    - chapters/04-data-exploration.qmd
    - chapters/05-data-preparation.qmd
    - chapters/06-model-evaluation.qmd
    - chapters/07-modeling.qmd
  appendices:
    - chapters/appendix-installation.qmd
    - chapters/references.qmd   # unnumbered, so it renders as plain "References", not "Appendix B"

bibliography: references.bib
# csl: apa.csl   # uncomment and add a .csl file if you want a specific citation style

format:
  html:
    theme: cosmo
    css: styles.css
    code-fold: false      # code shown by default; override per-cell with #| code-fold: true
    toc: true
  pdf:
    documentclass: book
    geometry:
      - margin=1in
    # For KDP paperback you'll adjust this to match your chosen trim size, e.g.:
    # papersize: "6in,9in"
  epub:
    cover-image: images/cover.png
