<svg viewBox="0 0 600 782" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background: neutral warm grey -->
  <rect x="0" y="0" width="600" height="782" fill="#EDECE7"/>

  <!-- Laptop illustration -->
  <g>
    <!-- screen: dark charcoal -->
    <rect x="200" y="66" width="200" height="122" rx="7" fill="#2B2B28" stroke="#2F5233" stroke-width="2.5"/>
    <circle cx="300" cy="76" r="2" fill="#AEB050"/>
    <!-- code lines: UNamur green + FEB olive, alternating -->
    <rect x="216" y="90" width="42" height="6" rx="2" fill="#AEB050"/>
    <rect x="230" y="104" width="94" height="6" rx="2" fill="#7C8471" opacity="0.9"/>
    <rect x="230" y="118" width="62" height="6" rx="2" fill="#2F5233"/>
    <rect x="216" y="132" width="112" height="6" rx="2" fill="#AEB050"/>
    <rect x="230" y="146" width="72" height="6" rx="2" fill="#7C8471" opacity="0.9"/>
    <rect x="216" y="160" width="50" height="6" rx="2" fill="#2F5233"/>
    <!-- base -->
    <path d="M 178 188 L 422 188 L 438 204 L 162 204 Z" fill="#3E3E3A"/>
  </g>

  <!-- Title -->
  <g fill="#2B2B28" font-family="Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1">
    <text x="300" y="270" font-size="40">INTRODUCTION TO DATA</text>
    <text x="300" y="322" font-size="40">ANALYTICS FOR BUSINESS</text>
    <text x="300" y="374" font-size="40">AND ECONOMICS</text>
  </g>

  <!-- Accent rule: FEB olive -->
  <rect x="210" y="406" width="180" height="3" fill="#AEB050"/>

  <!-- Subtitle -->
  <g fill="#5B5B55" font-family="Arial, Helvetica, sans-serif" font-weight="400" text-anchor="middle">
    <text x="300" y="450" font-size="19">Using Python for Data Preprocessing,</text>
    <text x="300" y="478" font-size="19">Visualization, and Modeling</text>
  </g>

  <!-- Author -->
  <rect x="280" y="694" width="40" height="2" fill="#2F5233"/>
  <text x="300" y="726" font-size="17" fill="#2B2B28" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="3" text-anchor="middle">MATTHIAS BOGAERT</text>
</svg>
